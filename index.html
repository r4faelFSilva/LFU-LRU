<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Completo - Algoritmos de Substituição de Páginas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Ícones SVG simplificados
        const PlayIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
        );

        const RefreshIcon = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
        );

        const CheckIcon = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );

        const XIcon = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        );

        const PageReplacementSimulator = () => {
            const [referenceString, setReferenceString] = useState('7 0 1 2 0 3 0 4 2 3 0 3 2');
            const [frameCount, setFrameCount] = useState(4);
            const [currentStep, setCurrentStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1000);
            const [lruSimulation, setLruSimulation] = useState(null);
            const [lfuSimulation, setLfuSimulation] = useState(null);
            const [fifoSimulation, setFifoSimulation] = useState(null);
            const [optimalSimulation, setOptimalSimulation] = useState(null);

            // Simulador LRU (Least Recently Used)
            const simulateLRU = (references, capacity) => {
                const steps = [];
                const frames = new Array(capacity).fill(null);
                const recentlyUsed = [];
                let pageFaults = 0;

                references.forEach((page, index) => {
                    const frameIndex = frames.indexOf(page);
                    let isHit = false;
                    let replacedPage = null;
                    let replacedIndex = -1;

                    if (frameIndex !== -1) {
                        isHit = true;
                        const pos = recentlyUsed.indexOf(page);
                        recentlyUsed.splice(pos, 1);
                        recentlyUsed.push(page);
                    } else {
                        pageFaults++;

                        if (frames.includes(null)) {
                            const emptyIndex = frames.indexOf(null);
                            frames[emptyIndex] = page;
                            recentlyUsed.push(page);
                            replacedIndex = emptyIndex;
                        } else {
                            const lruPage = recentlyUsed.shift();
                            const replaceIndex = frames.indexOf(lruPage);
                            replacedPage = lruPage;
                            replacedIndex = replaceIndex;
                            frames[replaceIndex] = page;
                            recentlyUsed.push(page);
                        }
                    }

                    steps.push({
                        step: index,
                        page,
                        frames: [...frames],
                        isHit,
                        pageFaults,
                        replacedPage,
                        replacedIndex
                    });
                });

                return { steps, finalFaults: pageFaults };
            };

            // Simulador LFU (Least Frequently Used)
            const simulateLFU = (references, capacity) => {
                const steps = [];
                const frames = new Array(capacity).fill(null);
                const frequency = new Map();
                let pageFaults = 0;

                references.forEach((page, index) => {
                    const frameIndex = frames.indexOf(page);
                    let isHit = false;
                    let replacedPage = null;
                    let replacedIndex = -1;

                    if (frameIndex !== -1) {
                        isHit = true;
                        frequency.set(page, (frequency.get(page) || 0) + 1);
                    } else {
                        pageFaults++;
                        frequency.set(page, 1);

                        if (frames.includes(null)) {
                            const emptyIndex = frames.indexOf(null);
                            frames[emptyIndex] = page;
                            replacedIndex = emptyIndex;
                        } else {
                            let minFreq = Infinity;
                            let lfuIndex = -1;

                            for (let j = 0; j < frames.length; j++) {
                                const framePage = frames[j];
                                const freq = frequency.get(framePage) || 0;
                                if (freq < minFreq) {
                                    minFreq = freq;
                                    lfuIndex = j;
                                }
                            }

                            replacedPage = frames[lfuIndex];
                            replacedIndex = lfuIndex;
                            frequency.delete(replacedPage);
                            frames[lfuIndex] = page;
                        }
                    }

                    steps.push({
                        step: index,
                        page,
                        frames: [...frames],
                        isHit,
                        pageFaults,
                        frequency: new Map(frequency),
                        replacedPage,
                        replacedIndex
                    });
                });

                return { steps, finalFaults: pageFaults };
            };

            // Simulador FIFO (First In First Out)
            const simulateFIFO = (references, capacity) => {
                const steps = [];
                const frames = new Array(capacity).fill(null);
                const insertionOrder = []; // Guarda ordem de inserção
                let pageFaults = 0;

                references.forEach((page, index) => {
                    const frameIndex = frames.indexOf(page);
                    let isHit = false;
                    let replacedPage = null;
                    let replacedIndex = -1;

                    if (frameIndex !== -1) {
                        // HIT - página já está na memória
                        isHit = true;
                    } else {
                        // FAULT - página não está na memória
                        pageFaults++;

                        if (frames.includes(null)) {
                            // Tem frame vazio
                            const emptyIndex = frames.indexOf(null);
                            frames[emptyIndex] = page;
                            insertionOrder.push(page);
                            replacedIndex = emptyIndex;
                        } else {
                            // Todos frames ocupados - remove o primeiro que entrou (FIFO)
                            const fifoPage = insertionOrder.shift(); // Remove primeiro da fila
                            const replaceIndex = frames.indexOf(fifoPage);
                            replacedPage = fifoPage;
                            replacedIndex = replaceIndex;
                            frames[replaceIndex] = page;
                            insertionOrder.push(page); // Adiciona no fim da fila
                        }
                    }

                    steps.push({
                        step: index,
                        page,
                        frames: [...frames],
                        isHit,
                        pageFaults,
                        insertionOrder: [...insertionOrder],
                        replacedPage,
                        replacedIndex
                    });
                });

                return { steps, finalFaults: pageFaults };
            };

            // Simulador ÓTIMO (Optimal - Belady's Algorithm)
            const simulateOptimal = (references, capacity) => {
                const steps = [];
                const frames = new Array(capacity).fill(null);
                let pageFaults = 0;

                references.forEach((page, index) => {
                    const frameIndex = frames.indexOf(page);
                    let isHit = false;
                    let replacedPage = null;
                    let replacedIndex = -1;

                    if (frameIndex !== -1) {
                        // HIT
                        isHit = true;
                    } else {
                        // FAULT
                        pageFaults++;

                        if (frames.includes(null)) {
                            // Tem frame vazio
                            const emptyIndex = frames.indexOf(null);
                            frames[emptyIndex] = page;
                            replacedIndex = emptyIndex;
                        } else {
                            // Remove a página que será usada mais tarde (ou nunca mais)
                            let farthestIndex = -1;
                            let pageToReplace = -1;
                            let replaceFrameIndex = -1;

                            for (let j = 0; j < frames.length; j++) {
                                const framePage = frames[j];
                                
                                // Procura próxima ocorrência desta página no futuro
                                let nextUse = -1;
                                for (let k = index + 1; k < references.length; k++) {
                                    if (references[k] === framePage) {
                                        nextUse = k;
                                        break;
                                    }
                                }

                                // Se nunca mais for usada, substitui esta
                                if (nextUse === -1) {
                                    pageToReplace = framePage;
                                    replaceFrameIndex = j;
                                    break;
                                }

                                // Se for usada mais tarde, guarda a que está mais longe
                                if (nextUse > farthestIndex) {
                                    farthestIndex = nextUse;
                                    pageToReplace = framePage;
                                    replaceFrameIndex = j;
                                }
                            }

                            replacedPage = pageToReplace;
                            replacedIndex = replaceFrameIndex;
                            frames[replaceFrameIndex] = page;
                        }
                    }

                    steps.push({
                        step: index,
                        page,
                        frames: [...frames],
                        isHit,
                        pageFaults,
                        replacedPage,
                        replacedIndex
                    });
                });

                return { steps, finalFaults: pageFaults };
            };

            const handleSimulate = () => {
                const references = referenceString.trim().split(/\s+/).map(Number);
                
                if (references.some(isNaN) || references.length === 0) {
                    alert('Por favor, digite uma sequência válida de números!');
                    return;
                }

                if (frameCount <= 0 || isNaN(frameCount)) {
                    alert('Por favor, digite uma quantidade válida de frames!');
                    return;
                }

                const lru = simulateLRU(references, frameCount);
                const lfu = simulateLFU(references, frameCount);
                const fifo = simulateFIFO(references, frameCount);
                const optimal = simulateOptimal(references, frameCount);

                setLruSimulation(lru);
                setLfuSimulation(lfu);
                setFifoSimulation(fifo);
                setOptimalSimulation(optimal);
                setCurrentStep(0);
                setIsPlaying(false);
            };

            const handleReset = () => {
                setCurrentStep(0);
                setIsPlaying(false);
                setLruSimulation(null);
                setLfuSimulation(null);
                setFifoSimulation(null);
                setOptimalSimulation(null);
            };

            const handlePlayPause = () => {
                if (!lruSimulation) {
                    handleSimulate();
                }
                setIsPlaying(!isPlaying);
            };

            useEffect(() => {
                if (isPlaying && lruSimulation && currentStep < lruSimulation.steps.length - 1) {
                    const timer = setTimeout(() => {
                        setCurrentStep(prev => prev + 1);
                    }, speed);
                    return () => clearTimeout(timer);
                } else if (currentStep >= lruSimulation?.steps.length - 1) {
                    setIsPlaying(false);
                }
            }, [isPlaying, currentStep, lruSimulation, speed]);

            const renderFrames = (frames, algorithm, step) => {
                const freq = step?.frequency;
                
                return (
                    <div className="flex gap-2 justify-center mt-4">
                        {frames.map((frame, idx) => {
                            const isReplaced = idx === step?.replacedIndex && !step?.isHit;
                            
                            return (
                                <div
                                    key={idx}
                                    className={`w-16 h-16 border-4 rounded-lg flex items-center justify-center text-xl font-bold transition-all duration-300 ${
                                        frame === null
                                            ? 'border-gray-300 bg-gray-50 text-gray-400'
                                            : frame === step?.page
                                            ? step.isHit
                                                ? 'border-green-500 bg-green-50 text-green-700 scale-110 shadow-lg'
                                                : 'border-red-500 bg-red-50 text-red-700 scale-110 shadow-lg ring-4 ring-yellow-300'
                                            : isReplaced
                                            ? 'border-orange-400 bg-orange-50 text-orange-700'
                                            : 'border-blue-500 bg-blue-50 text-blue-700'
                                    }`}
                                >
                                    <div className="text-center">
                                        <div>{frame ?? '−'}</div>
                                        {algorithm === 'lfu' && frame !== null && freq && (
                                            <div className="text-xs text-gray-500 mt-1">
                                                f:{freq.get(frame) || 0}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const currentLruStep = lruSimulation?.steps[currentStep];
            const currentLfuStep = lfuSimulation?.steps[currentStep];
            const currentFifoStep = fifoSimulation?.steps[currentStep];
            const currentOptimalStep = optimalSimulation?.steps[currentStep];
            const references = referenceString.trim().split(/\s+/).map(Number);

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                Simulador Completo de Substituição de Páginas
                            </h1>
                            <p className="text-gray-600">
                                LRU • LFU • FIFO • ÓTIMO - Comparação Lado a Lado
                            </p>
                        </div>

                        {/* Input Section */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <div className="grid md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                        Sequência de Referência
                                    </label>
                                    <input
                                        type="text"
                                        value={referenceString}
                                        onChange={(e) => setReferenceString(e.target.value)}
                                        placeholder="Ex: 1 2 3 4 1 2 5"
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                         Quantidade de Frames
                                    </label>
                                    <input
                                        type="number"
                                        value={frameCount}
                                        onChange={(e) => setFrameCount(parseInt(e.target.value))}
                                        min="1"
                                        max="10"
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="flex gap-3 items-center flex-wrap">
                                <button
                                    onClick={handleSimulate}
                                    className="flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold"
                                >
                                    <PlayIcon />
                                    Simular
                                </button>
                                <button
                                    onClick={handlePlayPause}
                                    disabled={!lruSimulation}
                                    className="flex items-center gap-2 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
                                >
                                    {isPlaying ? 'Pausar' : 'Auto Play'}
                                </button>
                                <button
                                    onClick={handleReset}
                                    className="flex items-center gap-2 px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors font-semibold"
                                >
                                    <RefreshIcon />
                                    Resetar
                                </button>
                                <div className="flex items-center gap-2 ml-auto">
                                    <label className="text-sm font-semibold text-gray-700">
                                        Velocidade:
                                    </label>
                                    <select
                                        value={speed}
                                        onChange={(e) => setSpeed(Number(e.target.value))}
                                        className="px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                    >
                                        <option value={2000}>Lento</option>
                                        <option value={1000}>Normal</option>
                                        <option value={500}>Rápido</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Progress Bar */}
                        {lruSimulation && (
                            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                                <div className="flex items-center gap-4 mb-4">
                                    <span className="text-sm font-semibold text-gray-700">
                                        Passo {currentStep + 1} de {lruSimulation.steps.length}
                                    </span>
                                    <div className="flex-1">
                                        <input
                                            type="range"
                                            min="0"
                                            max={lruSimulation.steps.length - 1}
                                            value={currentStep}
                                            onChange={(e) => setCurrentStep(parseInt(e.target.value))}
                                            className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                        />
                                    </div>
                                    <div className="text-sm font-semibold text-gray-700">
                                        Página: <span className="text-blue-600 text-xl">{currentLruStep?.page}</span>
                                    </div>
                                </div>

                                {/* Reference String Visualization */}
                                <div className="flex gap-2 justify-center flex-wrap">
                                    {references.map((ref, idx) => (
                                        <div
                                            key={idx}
                                            className={`w-10 h-10 rounded-lg flex items-center justify-center font-bold transition-all ${
                                                idx === currentStep
                                                    ? 'bg-blue-600 text-white scale-125 shadow-lg'
                                                    : idx < currentStep
                                                    ? 'bg-gray-300 text-gray-600'
                                                    : 'bg-gray-100 text-gray-400'
                                            }`}
                                        >
                                            {ref}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Simulation Results - Grid 2x2 */}
                        {lruSimulation && lfuSimulation && fifoSimulation && optimalSimulation && (
                            <div className="grid md:grid-cols-2 gap-6 mb-6">
                                {/* LRU */}
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">
                                            🔵 LRU (Least Recently Used)
                                        </h2>
                                        {currentLruStep?.isHit ? (
                                            <div className="flex items-center gap-2 text-green-600 font-bold text-sm">
                                                <CheckIcon />
                                                HIT
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 text-red-600 font-bold text-sm">
                                                <XIcon />
                                                FAULT
                                            </div>
                                        )}
                                    </div>

                                    {renderFrames(currentLruStep?.frames, 'lru', currentLruStep)}

                                    {/* Mensagem de Substituição */}
                                    {currentLruStep && !currentLruStep.isHit && (
                                        <div className="mt-3 p-2 bg-yellow-50 border-2 border-yellow-300 rounded-lg text-center">
                                            {currentLruStep.replacedPage !== null ? (
                                                <div className="text-xs font-semibold text-yellow-800">
                                                     Substituiu <span className="text-red-600">{currentLruStep.replacedPage}</span> por <span className="text-green-600">{currentLruStep.page}</span>
                                                </div>
                                            ) : (
                                                <div className="text-xs font-semibold text-blue-800">
                                                    ➕ Inseriu <span className="text-green-600">{currentLruStep.page}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="mt-4 space-y-2">
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Faults:</span>
                                            <span className="text-xl font-bold text-red-600">
                                                {currentLruStep?.pageFaults}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Hit Rate:</span>
                                            <span className="text-xl font-bold text-green-600">
                                                {((currentStep + 1 - currentLruStep?.pageFaults) / (currentStep + 1) * 100).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* LFU */}
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">
                                             LFU (Least Frequently Used)
                                        </h2>
                                        {currentLfuStep?.isHit ? (
                                            <div className="flex items-center gap-2 text-green-600 font-bold text-sm">
                                                <CheckIcon />
                                                HIT
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 text-red-600 font-bold text-sm">
                                                <XIcon />
                                                FAULT
                                            </div>
                                        )}
                                    </div>

                                    {renderFrames(currentLfuStep?.frames, 'lfu', currentLfuStep)}

                                    {/* Mensagem de Substituição */}
                                    {currentLfuStep && !currentLfuStep.isHit && (
                                        <div className="mt-3 p-2 bg-yellow-50 border-2 border-yellow-300 rounded-lg text-center">
                                            {currentLfuStep.replacedPage !== null ? (
                                                <div className="text-xs font-semibold text-yellow-800">
                                                     Substituiu <span className="text-red-600">{currentLfuStep.replacedPage}</span> por <span className="text-green-600">{currentLfuStep.page}</span>
                                                    <div className="text-xs text-gray-600 mt-1">(menor frequência)</div>
                                                </div>
                                            ) : (
                                                <div className="text-xs font-semibold text-blue-800">
                                                    ➕ Inseriu <span className="text-green-600">{currentLfuStep.page}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="mt-4 space-y-2">
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Faults:</span>
                                            <span className="text-xl font-bold text-red-600">
                                                {currentLfuStep?.pageFaults}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Hit Rate:</span>
                                            <span className="text-xl font-bold text-green-600">
                                                {((currentStep + 1 - currentLfuStep?.pageFaults) / (currentStep + 1) * 100).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* FIFO */}
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">
                                             FIFO (First In First Out)
                                        </h2>
                                        {currentFifoStep?.isHit ? (
                                            <div className="flex items-center gap-2 text-green-600 font-bold text-sm">
                                                <CheckIcon />
                                                HIT
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 text-red-600 font-bold text-sm">
                                                <XIcon />
                                                FAULT
                                            </div>
                                        )}
                                    </div>

                                    {renderFrames(currentFifoStep?.frames, 'fifo', currentFifoStep)}

                                    {/* Mensagem de Substituição */}
                                    {currentFifoStep && !currentFifoStep.isHit && (
                                        <div className="mt-3 p-2 bg-yellow-50 border-2 border-yellow-300 rounded-lg text-center">
                                            {currentFifoStep.replacedPage !== null ? (
                                                <div className="text-xs font-semibold text-yellow-800">
                                                     Substituiu <span className="text-red-600">{currentFifoStep.replacedPage}</span> por <span className="text-green-600">{currentFifoStep.page}</span>
                                                    <div className="text-xs text-gray-600 mt-1">(primeiro a entrar)</div>
                                                </div>
                                            ) : (
                                                <div className="text-xs font-semibold text-blue-800">
                                                    ➕ Inseriu <span className="text-green-600">{currentFifoStep.page}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="mt-4 space-y-2">
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Faults:</span>
                                            <span className="text-xl font-bold text-red-600">
                                                {currentFifoStep?.pageFaults}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Hit Rate:</span>
                                            <span className="text-xl font-bold text-green-600">
                                                {((currentStep + 1 - currentFifoStep?.pageFaults) / (currentStep + 1) * 100).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* ÓTIMO */}
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-xl font-bold text-gray-800">
                                             ÓTIMO (Optimal)
                                        </h2>
                                        {currentOptimalStep?.isHit ? (
                                            <div className="flex items-center gap-2 text-green-600 font-bold text-sm">
                                                <CheckIcon />
                                                HIT
                                            </div>
                                        ) : (
                                            <div className="flex items-center gap-2 text-red-600 font-bold text-sm">
                                                <XIcon />
                                                FAULT
                                            </div>
                                        )}
                                    </div>

                                    {renderFrames(currentOptimalStep?.frames, 'optimal', currentOptimalStep)}

                                    {/* Mensagem de Substituição */}
                                    {currentOptimalStep && !currentOptimalStep.isHit && (
                                        <div className="mt-3 p-2 bg-yellow-50 border-2 border-yellow-300 rounded-lg text-center">
                                            {currentOptimalStep.replacedPage !== null ? (
                                                <div className="text-xs font-semibold text-yellow-800">
                                                     Substituiu <span className="text-red-600">{currentOptimalStep.replacedPage}</span> por <span className="text-green-600">{currentOptimalStep.page}</span>
                                                    <div className="text-xs text-gray-600 mt-1">(usada mais tarde)</div>
                                                </div>
                                            ) : (
                                                <div className="text-xs font-semibold text-blue-800">
                                                    ➕ Inseriu <span className="text-green-600">{currentOptimalStep.page}</span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="mt-4 space-y-2">
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Faults:</span>
                                            <span className="text-xl font-bold text-red-600">
                                                {currentOptimalStep?.pageFaults}
                                            </span>
                                        </div>
                                        <div className="flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm">
                                            <span className="font-semibold text-gray-700">Hit Rate:</span>
                                            <span className="text-xl font-bold text-green-600">
                                                {((currentStep + 1 - currentOptimalStep?.pageFaults) / (currentStep + 1) * 100).toFixed(1)}%
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Comparison Final */}
                        {lruSimulation && lfuSimulation && fifoSimulation && optimalSimulation && currentStep === lruSimulation.steps.length - 1 && (
                            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                                <h2 className="text-2xl font-bold text-gray-800 mb-4 text-center">
                                     Comparação Final - Total de Page Faults
                                </h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className={`text-center p-4 rounded-lg ${
                                        lruSimulation.finalFaults === Math.min(lruSimulation.finalFaults, lfuSimulation.finalFaults, fifoSimulation.finalFaults, optimalSimulation.finalFaults)
                                        ? 'bg-green-100 border-2 border-green-500'
                                        : 'bg-blue-50'
                                    }`}>
                                        <div className="text-sm text-gray-600 mb-1">LRU</div>
                                        <div className="text-3xl font-bold text-blue-600">
                                            {lruSimulation.finalFaults}
                                        </div>
                                        <div className="text-xs text-gray-500">faults</div>
                                    </div>
                                    <div className={`text-center p-4 rounded-lg ${
                                        lfuSimulation.finalFaults === Math.min(lruSimulation.finalFaults, lfuSimulation.finalFaults, fifoSimulation.finalFaults, optimalSimulation.finalFaults)
                                        ? 'bg-green-100 border-2 border-green-500'
                                        : 'bg-purple-50'
                                    }`}>
                                        <div className="text-sm text-gray-600 mb-1">LFU</div>
                                        <div className="text-3xl font-bold text-purple-600">
                                            {lfuSimulation.finalFaults}
                                        </div>
                                        <div className="text-xs text-gray-500">faults</div>
                                    </div>
                                    <div className={`text-center p-4 rounded-lg ${
                                        fifoSimulation.finalFaults === Math.min(lruSimulation.finalFaults, lfuSimulation.finalFaults, fifoSimulation.finalFaults, optimalSimulation.finalFaults)
                                        ? 'bg-green-100 border-2 border-green-500'
                                        : 'bg-green-50'
                                    }`}>
                                        <div className="text-sm text-gray-600 mb-1">FIFO</div>
                                        <div className="text-3xl font-bold text-green-600">
                                            {fifoSimulation.finalFaults}
                                        </div>
                                        <div className="text-xs text-gray-500">faults</div>
                                    </div>
                                    <div className={`text-center p-4 rounded-lg ${
                                        optimalSimulation.finalFaults === Math.min(lruSimulation.finalFaults, lfuSimulation.finalFaults, fifoSimulation.finalFaults, optimalSimulation.finalFaults)
                                        ? 'bg-green-100 border-2 border-green-500'
                                        : 'bg-yellow-50'
                                    }`}>
                                        <div className="text-sm text-gray-600 mb-1">ÓTIMO</div>
                                        <div className="text-3xl font-bold text-yellow-600">
                                            {optimalSimulation.finalFaults}
                                        </div>
                                        <div className="text-xs text-gray-500">faults</div>
                                    </div>
                                </div>
                                <div className="mt-4 text-center text-sm text-gray-600">
                                    {optimalSimulation.finalFaults === Math.min(lruSimulation.finalFaults, lfuSimulation.finalFaults, fifoSimulation.finalFaults, optimalSimulation.finalFaults) && (
                                        <div className="p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                                             <strong>ÓTIMO</strong> sempre tem o menor número de faults (ou empata), mas é impraticável na vida real pois precisa conhecer o futuro!
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Legend */}
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h3 className="font-bold text-gray-800 mb-3">📖 Legenda & Explicação:</h3>
                            <div className="grid md:grid-cols-2 gap-4 text-sm mb-4">
                                <div>
                                    <h4 className="font-bold text-gray-700 mb-2">Cores:</h4>
                                    <div className="space-y-2">
                                        <div className="flex items-center gap-2">
                                            <div className="w-6 h-6 border-4 border-green-500 bg-green-50 rounded"></div>
                                            <span><strong>Verde:</strong> HIT (página na memória)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-6 h-6 border-4 border-red-500 bg-red-50 rounded ring-4 ring-yellow-300"></div>
                                            <span><strong>Vermelho:</strong> FAULT (precisa carregar)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-6 h-6 border-4 border-blue-500 bg-blue-50 rounded"></div>
                                            <span><strong>Azul:</strong> Página na memória</span>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-700 mb-2">Algoritmos:</h4>
                                    <div className="space-y-2">
                                        <div><strong> LRU:</strong> Remove menos recente</div>
                                        <div><strong> LFU:</strong> Remove menos frequente</div>
                                        <div><strong> FIFO:</strong> Remove primeiro a entrar</div>
                                        <div><strong> ÓTIMO:</strong> Remove o que será usado mais tarde</div>
                                    </div>
                                </div>
                            </div>
                            <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs">
                                <strong> Dica:</strong> O algoritmo ÓTIMO sempre tem o melhor resultado possível, mas não é prático na vida real porque precisaria "ver o futuro" da sequência de acessos!
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Renderizar aplicação
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PageReplacementSimulator />);
    </script>
</body>
</html>
